# SwarmForge window configuration for square_client.
# Format: window <role> <agent> <worktree>
#   - agent:    claude | codex | none
#   - worktree: master (no worktree, work in main repo) | <name> (creates .worktrees/<name>)
#
# Roles:
#   architect — owns the build plan, decomposes work into slices, owns the specs under swarmforge/specs/.
#   coder     — implements one slice at a time in its own worktree.
#   reviewer  — gates every commit against the constitution.
#   logger    — passive transcript window, no agent.

window architect claude master
window coder     claude coder
window reviewer  claude reviewer
window logger    none   none
